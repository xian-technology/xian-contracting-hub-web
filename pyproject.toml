[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "contracting-hub"
version = "0.3.0"
description = "Curated smart-contract repository for the Xian ecosystem."
readme = { file = "specs/overview.md", content-type = "text/markdown" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "reflex>=0.9.6.post1,<0.10.0",
    "sqlmodel==0.0.38",
    "sqlalchemy==2.0.49",
    "alembic==1.18.4",
    "xian-tech-contracting>=1.1.0,<2",
    "xian-tech-linter>=0.4.0,<1",
    "xian-tech-py>=0.5.0,<1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.12",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "playwright==1.58.0",
    "pytest-playwright==0.7.2",
]

[tool.setuptools.packages.find]
include = ["contracting_hub*"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests for pure Python modules and helpers",
    "integration: database-backed and application integration tests",
    "e2e: end-to-end tests covering app entrypoints and browser workflows",
    "smoke: startup and foundation checks for early regressions",
    "playwright: tests that require installed Playwright browser binaries",
]
required_plugins = ["pytest-cov", "pytest-timeout", "pytest-playwright"]
timeout = 30

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
branch = true
source = ["contracting_hub"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.uv.sources]
xian-tech-contracting = { path = "../xian-contracting", editable = true }
xian-tech-linter = { path = "../xian-linter", editable = true }
xian-tech-py = { path = "../xian-py", editable = true }
