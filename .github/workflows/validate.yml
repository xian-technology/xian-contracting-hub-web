name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-contracting-hub-web
        uses: actions/checkout@v7
        with:
          path: xian-contracting-hub-web

      - name: Checkout xian-contracting
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Checkout xian-linter
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-linter
          ref: main
          path: xian-linter

      - name: Checkout xian-py
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Sync dependencies
        working-directory: xian-contracting-hub-web
        run: uv sync --extra dev

      - name: Ruff lint
        working-directory: xian-contracting-hub-web
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: xian-contracting-hub-web
        run: uv run ruff format --check .

      - name: Run unit tests
        working-directory: xian-contracting-hub-web
        run: uv run pytest -q tests/unit

      - name: Export Reflex app
        working-directory: xian-contracting-hub-web
        run: uv run reflex export --no-zip
